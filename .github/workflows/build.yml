name: Node.js Build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./vapor3d-sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vapor3d-sdk/package-lock.json
      
      - run: npm ci
        name: Install dependencies
      
      - run: npm run build
        name: Build
      
      - name: Create timestamp
        id: timestamp
        if: ${{ github.event_name != 'release' }}
        run: echo "value=$(date -u '+%Y-%m-%d-%H-%M-%S')" >> "$GITHUB_OUTPUT"
      
      - name: Upload to Release
        if: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
        uses: softprops/action-gh-release@v3
        with:
          files: vapor3d-sdk/dist/vapor3d.js
      
      - name: Publish Snapshot
        if: ${{ github.event_name != 'release' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: snapshot-${{ steps.timestamp.outputs.value }}
          target_commitish: ${{ github.sha }}
          name: Snapshot ${{ steps.timestamp.outputs.value }}
          body: Automated build from commit ${{ github.sha }}
          prerelease: true
          files: vapor3d-sdk/dist/vapor3d.js

      - name: Read readme
        id: read_readme
        run: |
          delimiter="$(openssl rand -hex 16)"
          {
            echo "content<<${delimiter}"
            cat ../.github/README.md
            echo
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Handle Tag Name
        id: handle_tag_name
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: echo "tag_name=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Vapor Deploy
        uses: IMG-F/vapor-deploy@v1.0.1
        if: ${{ github.event_name == 'release' && github.event.release.prerelease == false }}
        with:
          file: vapor3d-sdk/dist/vapor3d.js
          project-oid: 69ec6f402a7d36316189c3cb
          token: ${{ secrets.CCW_TOKEN }}
          eid: vapor3D
          cover: .github/cover.png
          version: ${{ steps.handle_tag_name.outputs.tag_name }}
          name: Vapor 3D
          desc: Vapor 3D - WebGL2 3D Engine
          readme: ${{ steps.read_readme.outputs.content }}
          changelog: ${{ github.event.release.body }}